name: Build Python Windows installer and release

on:
  push:
    branches: [ main, redesign-4.2.0 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Python source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem "python_src_v4.b64.part*" | Sort-Object Name
          if (-not $parts) { throw "No se encontraron los fragmentos del código Python" }
          $joined = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($joined)
          [IO.File]::WriteAllBytes("python_src_v4.zip", $bytes)
          if (Test-Path python_app) { Remove-Item python_app -Recurse -Force }
          New-Item -ItemType Directory -Force -Path python_app | Out-Null
          Expand-Archive -Path python_src_v4.zip -DestinationPath python_app -Force

      - name: Apply Bluetooth reliability fixes
        shell: pwsh
        run: |
          python python_hotfix_native\stale_gatt_patch.py
          python python_hotfix_native\silent_reconnect_patch.py
          Copy-Item python_hotfix_native\printer.py python_app\phomemo_studio\printer.py -Force
          Copy-Item python_hotfix_native\installer.iss python_app\installer.iss -Force

      - name: Apply Phomemo Studio 4.2 editor
        shell: pwsh
        run: |
          Copy-Item python_hotfix_native\v420\ui.py python_app\phomemo_studio\ui.py -Force
          Copy-Item python_hotfix_native\v420\core.py python_app\phomemo_studio\core.py -Force
          Copy-Item python_hotfix_native\v420\render.py python_app\phomemo_studio\render.py -Force
          Copy-Item python_hotfix_native\v420\updater.py python_app\phomemo_studio\updater.py -Force
          Copy-Item python_hotfix_native\v420\main.py python_app\phomemo_studio\main.py -Force
          Copy-Item python_hotfix_native\v420\shapes.py python_app\phomemo_studio\shapes.py -Force
          Copy-Item python_hotfix_native\v420\PhomemoStudio.spec python_app\PhomemoStudio.spec -Force
          $initPath = "python_app\phomemo_studio\__init__.py"
          $init = Get-Content $initPath -Raw
          $init = $init.Replace('__version__ = "4.0.0"', '__version__ = "4.2.0"')
          Set-Content -Path $initPath -Value $init -Encoding utf8 -NoNewline
          Write-Host "Applied 4.2.0: modern editor, full system font catalog, shape library, automatic updater and refreshed Windows icon"

      - name: Restore Sr Gato source asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path python_app\assets | Out-Null
          $parts = Get-ChildItem "src\PhomemoStudio\Assets\sr-gato.b64.part*" | Sort-Object Name
          if (-not $parts) { throw "No se encontraron los fragmentos del logo Sr Gato" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $png = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("python_app\assets\sr-gato.png", $png)

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r python_app\requirements.txt

      - name: Build transparent Windows icon
        shell: pwsh
        run: |
          python python_hotfix_native\v420\build_icon.py
          if (-not (Test-Path python_app\assets\sr-gato.ico)) { throw "No se generó el icono transparente" }
          if (-not (Test-Path python_app\assets\sr-gato-transparent.png)) { throw "No se generó el PNG transparente" }

      - name: Run Python tests
        shell: pwsh
        env:
          PYTHONPATH: python_app
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q python_app\phomemo_studio python_app\tests
          pytest -q python_app\tests --ignore=python_app\tests\test_printer.py
          python -c "from phomemo_studio.printer import D30Printer; p=D30Printer(); assert p.snapshot.name=='D30'; assert hasattr(p,'maintain_connection'); p.close(); print('Native BLE wrapper smoke OK')"
          python -c "from pathlib import Path; p=Path('python_app/phomemo_studio/printer.py').read_text(encoding='utf-8'); b=Path('native_bridge/PhomemoBleBridge/Program.cs').read_text(encoding='utf-8'); assert '\"allowDiscovery\": False' in p; assert '\"allowDiscovery\": True' in p; assert 'ConnectAsync(preferredAddress, false)' in b; assert 'if (!allowDiscovery)' in b; print('Silent reconnect policy present')"
          python -c "from PySide6.QtWidgets import QApplication; from phomemo_studio.ui import MainWindow; from phomemo_studio.shapes import SHAPES; a=QApplication([]); w=MainWindow(); assert len(SHAPES)>=30; assert w.prop_font.count()>5; assert w._maintenance_timer.interval()==30000; w.roll_remaining.setValue(22); before=w.roll_remaining.value(); w.on_future_done(('calibrated',0),None); assert w.roll_remaining.value()==before; w.on_future_done(('printed',1),None); assert w.roll_remaining.value()==before-1; assert w.update_btn.text(); w.close(); print('Modern UI + fonts + shapes + roll accounting smoke OK')"
          python -c "from PySide6.QtWidgets import QApplication; from phomemo_studio.core import Element; from phomemo_studio.render import render_label; a=QApplication.instance() or QApplication([]); img=render_label([Element('shape',5,5,60,40,shape='heart',fill=True),Element('text',70,5,120,35,text='Studio',font='Segoe UI',font_size=14)],40,12); assert img.size[0]>0 and img.size[1]>0; print('Qt render + shape smoke OK',img.size)"

      - name: Build native BLE bridge
        shell: pwsh
        run: |
          dotnet publish native_bridge\PhomemoBleBridge\PhomemoBleBridge.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o native_bridge\publish
          if (-not (Test-Path native_bridge\publish\PhomemoBleBridge.exe)) { throw "No se generó PhomemoBleBridge.exe" }
          Write-Host "BLE bridge bytes: $((Get-Item native_bridge\publish\PhomemoBleBridge.exe).Length)"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build Python EXE
        shell: pwsh
        working-directory: python_app
        run: |
          pyinstaller --noconfirm --clean PhomemoStudio.spec
          if (-not (Test-Path dist\PhomemoStudio.exe)) { throw "PyInstaller no generó PhomemoStudio.exe" }
          Write-Host "EXE bytes: $((Get-Item dist\PhomemoStudio.exe).Length)"

      - name: Stage native BLE bridge
        shell: pwsh
        run: |
          Copy-Item native_bridge\publish\PhomemoBleBridge.exe python_app\dist\PhomemoBleBridge.exe -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        working-directory: python_app
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" installer.iss
          $hash = (Get-FileHash dist\PhomemoStudioSetup.exe -Algorithm SHA256).Hash
          "$hash  PhomemoStudioSetup.exe" | Out-File -Encoding ascii dist\PhomemoStudioSetup.exe.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhomemoStudio-${{ steps.version.outputs.value }}-Redesign
          path: |
            python_app/dist/PhomemoStudioSetup.exe
            python_app/dist/PhomemoStudioSetup.exe.sha256
            python_app/dist/PhomemoStudio.exe
            python_app/dist/PhomemoBleBridge.exe

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target main --title "Phomemo Studio $tag" --notes "V4.2.0: rediseño completo del editor con una interfaz moderna y más clara; catálogo amplio y buscable de formas geométricas originales; selector con todas las familias de fuentes expuestas por Windows y carga adicional de fuentes locales/Adobe Creative Cloud; renderizado con Qt para que la fuente elegida también se respete al imprimir; actualizador de un clic que descarga, verifica, inicia la instalación y cierra la app automáticamente; icono de Windows regenerado con transparencia real y AppUserModelID propio para corregir el fondo blanco en la barra de tareas. Conserva la conexión D30 estable, la reconexión silenciosa y la calibración sin descontar etiquetas."
          }
          gh release upload $tag python_app\dist\PhomemoStudioSetup.exe python_app\dist\PhomemoStudioSetup.exe.sha256 --clobber
