name: Build Python Windows installer and release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Python source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem "python_src_v4.b64.part*" | Sort-Object Name
          if (-not $parts) { throw "No se encontraron los fragmentos del código Python" }
          $joined = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($joined)
          [IO.File]::WriteAllBytes("python_src_v4.zip", $bytes)
          if (Test-Path python_app) { Remove-Item python_app -Recurse -Force }
          New-Item -ItemType Directory -Force -Path python_app | Out-Null
          Expand-Archive -Path python_src_v4.zip -DestinationPath python_app -Force

      - name: Apply 5.1.0 app enhancements
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python python_hotfix_native\stale_gatt_patch.py
          python python_hotfix_native\silent_reconnect_patch.py
          Copy-Item python_hotfix_native\printer.py python_app\phomemo_studio\printer.py -Force
          Copy-Item python_hotfix_native\installer.iss python_app\installer.iss -Force
          python python_hotfix_native\ui_patch.py
          python python_hotfix_native\studio_pro_patch.py
          python python_hotfix_native\v51_redesign_patch.py
          $initPath = "python_app\phomemo_studio\__init__.py"
          $init = Get-Content $initPath -Raw
          $init = $init.Replace('__version__ = "4.0.0"', '__version__ = "5.1.0"')
          Set-Content -Path $initPath -Value $init -Encoding utf8 -NoNewline
          Write-Host "Applied 5.1.0: complete from-scratch workspace redesign, recoverable panels, scrollable inspector and categorized shape library"

      - name: Restore transparent Sr Gato assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path python_app\assets | Out-Null
          $parts = Get-ChildItem "src\PhomemoStudio\Assets\sr-gato.b64.part*" | Sort-Object Name
          if (-not $parts) { throw "No se encontraron los fragmentos del logo Sr Gato" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $png = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("python_app\assets\sr-gato.png", $png)

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install -r python_app\requirements.txt

      - name: Build transparent Windows icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -c "from PIL import Image; from pathlib import Path; p=Path('python_app/assets/sr-gato.png'); img=Image.open(p).convert('RGBA'); bbox=img.getchannel('A').getbbox(); img=img.crop(bbox) if bbox else img; side=max(img.size); pad=max(8,int(side*.06)); out=Image.new('RGBA',(side+pad*2,side+pad*2),(0,0,0,0)); out.alpha_composite(img,((out.width-img.width)//2,(out.height-img.height)//2)); out.save('python_app/assets/sr-gato.ico',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)]); assert out.getchannel('A').getextrema()[0]==0; print('Transparent icon alpha',out.getchannel('A').getextrema())"

      - name: Run Python tests
        shell: pwsh
        env:
          PYTHONPATH: python_app
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          python -m compileall -q python_app\phomemo_studio python_app\tests
          pytest -q python_app\tests --ignore=python_app\tests\test_printer.py
          python -c "from phomemo_studio.printer import D30Printer; p=D30Printer(); assert p.snapshot.name=='D30'; assert hasattr(p,'maintain_connection'); p.close(); print('Native BLE wrapper smoke OK')"
          python -c "from phomemo_studio.studio_pro import SHAPES,shape_path; assert len(SHAPES)>=40; assert not shape_path('Corazón').isEmpty(); print('Shape library',len(SHAPES))"
          python -c "from pathlib import Path; s=Path('python_app/PhomemoStudio.spec').read_text(encoding='utf-8'); assert 'sr-gato.ico' in s; print('EXE icon embedded in spec')"
          python -c "from PySide6.QtWidgets import QApplication,QFrame,QScrollArea; from phomemo_studio.ui import MainWindow; a=QApplication([]); w=MainWindow(); root=w.findChild(QFrame,'v51Rail'); drawer=w.findChild(QFrame,'v51Drawer'); inspector=w.findChild(QFrame,'v51Inspector'); scroll=w.findChild(QScrollArea,'v51InspectorScroll'); assert root and drawer and inspector and scroll; w._v51_hide_drawer(); assert not drawer.isVisible(); w._v51_show_drawer('Formas'); assert drawer.isVisible(); w.roll_remaining.setValue(22); before=w.roll_remaining.value(); w.on_future_done(('calibrated',0),None); assert w.roll_remaining.value()==before; w.on_future_done(('printed',1),None); assert w.roll_remaining.value()==before-1; assert len(w._v51_drawer_pages)==5; w.close(); print('V5.1 redesign + recoverable panels + roll accounting smoke OK')"

      - name: Build native BLE bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish native_bridge\PhomemoBleBridge\PhomemoBleBridge.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o native_bridge\publish
          if (-not (Test-Path native_bridge\publish\PhomemoBleBridge.exe)) { throw "No se generó PhomemoBleBridge.exe" }
          Write-Host "BLE bridge bytes: $((Get-Item native_bridge\publish\PhomemoBleBridge.exe).Length)"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = (Get-Content version.txt -Raw).Trim()
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build Python EXE
        shell: pwsh
        working-directory: python_app
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller --noconfirm --clean PhomemoStudio.spec
          if (-not (Test-Path dist\PhomemoStudio.exe)) { throw "PyInstaller no generó PhomemoStudio.exe" }
          Write-Host "EXE bytes: $((Get-Item dist\PhomemoStudio.exe).Length)"

      - name: Stage native BLE bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item native_bridge\publish\PhomemoBleBridge.exe python_app\dist\PhomemoBleBridge.exe -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        working-directory: python_app
        run: |
          $ErrorActionPreference = "Stop"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló" }
          $hash = (Get-FileHash dist\PhomemoStudioSetup.exe -Algorithm SHA256).Hash
          "$hash  PhomemoStudioSetup.exe" | Out-File -Encoding ascii dist\PhomemoStudioSetup.exe.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhomemoStudio-${{ steps.version.outputs.value }}-Redesign
          path: |
            python_app/dist/PhomemoStudioSetup.exe
            python_app/dist/PhomemoStudioSetup.exe.sha256
            python_app/dist/PhomemoStudio.exe
            python_app/dist/PhomemoBleBridge.exe

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v${{ steps.version.outputs.value }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target main --title "Phomemo Studio $tag" --notes "V5.1.0: rediseño completo de la interfaz desde cero. Nuevo workspace con barra lateral permanente, panel de biblioteca recuperable, lienzo central amplio, inspector derecho desplazable sin superposiciones y menús reorganizados. La biblioteca de formas queda agrupada por categorías, se puede cerrar y volver a abrir siempre desde la barra lateral o Ver > Biblioteca de formas. Se mantienen las fuentes de Windows/Adobe, el actualizador automático, el icono transparente, la calibración sin descontar etiquetas y la reconexión Bluetooth silenciosa."
          }
          gh release upload $tag python_app\dist\PhomemoStudioSetup.exe python_app\dist\PhomemoStudioSetup.exe.sha256 --clobber
