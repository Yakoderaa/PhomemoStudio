name: Build Python Windows installer and release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Python source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem "python_src_v4.b64.part*" | Sort-Object Name
          if (-not $parts) { throw "No se encontraron los fragmentos del código Python" }
          $joined = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($joined)
          [IO.File]::WriteAllBytes("python_src_v4.zip", $bytes)
          if (Test-Path python_app) { Remove-Item python_app -Recurse -Force }
          New-Item -ItemType Directory -Force -Path python_app | Out-Null
          Expand-Archive -Path python_src_v4.zip -DestinationPath python_app -Force

      - name: Apply 6.0.6 app enhancements
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python python_hotfix_native\stale_gatt_patch.py
          python python_hotfix_native\silent_reconnect_patch.py
          Copy-Item python_hotfix_native\printer.py python_app\phomemo_studio\printer.py -Force
          Copy-Item python_hotfix_native\installer.iss python_app\installer.iss -Force
          python python_hotfix_native\ui_patch.py
          python python_hotfix_native\studio_pro_patch.py
          python python_hotfix_native\v531_updater_patch.py
          python python_hotfix_native\v51_redesign_patch.py
          python python_hotfix_native\v52_polish_patch.py
          python python_hotfix_native\v53_fonts_library_patch.py
          python python_hotfix_native\v54_assets_session_patch.py
          python python_hotfix_native\v55_transform_handles_patch.py
          python python_hotfix_native\v56_text_lines_rotation_patch.py
          python python_hotfix_native\v57_undo_redo_patch.py
          python python_hotfix_native\v58_text_clipboard_layers_patch.py
          python python_hotfix_native\v59_properties_line_resize_patch.py
          python python_hotfix_native\v591_rotated_line_resize_patch.py
          python python_hotfix_native\v510_print_designs_patch.py
          python python_hotfix_native\v5101_exact_print_patch.py
          python python_hotfix_native\v5103_header_status_patch.py
          python python_hotfix_native\v60_illustrator_workspace_patch.py
          python python_hotfix_native\v601_dark_zoom_print_patch.py
          python python_hotfix_native\v602_menu_cleanup_patch.py
          python python_hotfix_native\v602_taskbar_icon_patch.py
          python python_hotfix_native\v603_print_queue_concentration_patch.py
          python python_hotfix_native\v604_alignment_multiselect_patch.py
          python python_hotfix_native\v605_canvas_workspace_patch.py
          python python_hotfix_native\v606_quality_safearea_patch.py
          $initPath = "python_app\phomemo_studio\__init__.py"
          $init = Get-Content $initPath -Raw
          $init = $init.Replace('__version__ = "4.0.0"', '__version__ = "6.0.6"')
          Set-Content -Path $initPath -Value $init -Encoding utf8 -NoNewline
          Write-Host "Applied 6.0.6: stipple preservation + supersampled lines + rounded safe frame + 9-way safe alignment + header cleanup"

      - name: Restore transparent Sr Gato assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path python_app\assets | Out-Null
          $parts = Get-ChildItem "src\PhomemoStudio\Assets\sr-gato.b64.part*" | Sort-Object Name
          if (-not $parts) { throw "No se encontraron los fragmentos del logo Sr Gato" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $png = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("python_app\assets\sr-gato.png", $png)

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install -r python_app\requirements.txt

      - name: Build transparent Windows icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -c "from PIL import Image; from pathlib import Path; p=Path('python_app/assets/sr-gato.png'); img=Image.open(p).convert('RGBA'); bbox=img.getchannel('A').getbbox(); img=img.crop(bbox) if bbox else img; side=max(img.size); pad=max(8,int(side*.06)); out=Image.new('RGBA',(side+pad*2,side+pad*2),(0,0,0,0)); out.alpha_composite(img,((out.width-img.width)//2,(out.height-img.height)//2)); out.save('python_app/assets/sr-gato.ico',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)]); assert out.getchannel('A').getextrema()[0]==0; print('Transparent icon alpha',out.getchannel('A').getextrema())"

      - name: Run Python tests
        shell: pwsh
        env:
          PYTHONPATH: python_app
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = "Stop"
          python -m compileall -q python_app\phomemo_studio python_app\tests
          pytest -q python_app\tests --ignore=python_app\tests\test_printer.py
          python -c "from phomemo_studio.printer import D30Printer; p=D30Printer(); assert p.snapshot.name=='D30'; assert hasattr(p,'maintain_connection'); p.close(); print('Native BLE wrapper smoke OK')"
          python -c "from phomemo_studio.studio_pro import SHAPES,shape_path; assert len(SHAPES)>=40; assert not shape_path('Corazón').isEmpty(); print('Shape library',len(SHAPES))"
          python -c "from PySide6.QtWidgets import QApplication; a=QApplication([]); from phomemo_studio.v53_fonts_library import massive_catalog_size; n=massive_catalog_size(); assert n>20000, n; print('Massive open object catalog',n)"
          python -c "from pathlib import Path; s=Path('python_app/PhomemoStudio.spec').read_text(encoding='utf-8'); assert 'sr-gato.ico' in s; u=Path('python_app/phomemo_studio/studio_pro.py').read_text(encoding='utf-8'); assert 'PhomemoStudioUpdater.exe' in u and 'powershell.exe' not in u and 'shutil.copy2' in u; iss=Path('python_app/installer.iss').read_text(encoding='utf-8'); assert 'PhomemoStudioUpdater.exe' in iss and 'skipifnotsilent' in iss; helper=Path('python_hotfix_native/update_helper.py').read_text(encoding='utf-8'); assert 'taskkill' in helper and 'installer exit=' in helper and 'relaunch fallback' in helper; print('Standalone updater handoff/install/relaunch smoke OK')"
          python -c "from PySide6.QtGui import QFontDatabase; from PySide6.QtWidgets import QApplication,QFrame,QScrollArea,QTabWidget,QSpinBox,QDoubleSpinBox,QAbstractSpinBox; from phomemo_studio.ui import MainWindow; from phomemo_studio.v53_fonts_library import _font_combos; a=QApplication([]); w=MainWindow(); rail=w.findChild(QFrame,'v51Rail'); drawer=w.findChild(QFrame,'v51Drawer'); inspector=w.findChild(QFrame,'v51Inspector'); scroll=w.findChild(QScrollArea,'v51InspectorScroll'); tabs=w.findChild(QTabWidget,'v52OpenLibraryTabs'); assert rail and drawer and inspector and scroll and tabs and tabs.count()>=3; spins=list(w.findChildren(QSpinBox))+list(w.findChildren(QDoubleSpinBox)); assert spins and all(bool(s.property('v601StepperInstalled')) for s in spins); fonts=_font_combos(w,QFontDatabase.families()); assert fonts and all(c.isEditable() and c.completer() is not None and c.lineEdit() is not None and not c.lineEdit().isClearButtonEnabled() for c in fonts); assert getattr(w,'_v53_font_timer').isActive(); w._v51_hide_drawer(); assert drawer.isHidden(); w._v51_show_drawer('Formas'); assert not drawer.isHidden(); w.roll_remaining.setValue(22); before=w.roll_remaining.value(); w.on_future_done(('calibrated',0),None); assert w.roll_remaining.value()==before; w.on_future_done(('printed',1),None); assert w.roll_remaining.value()==before-1; w.close(); print('V5.3.2 UI + clean font selector + library + roll accounting smoke OK')"
          python python_hotfix_native\v54_smoke.py
          python python_hotfix_native\v55_smoke.py
          python python_hotfix_native\v56_smoke.py
          python python_hotfix_native\v57_smoke.py
          python python_hotfix_native\v58_smoke.py
          python python_hotfix_native\v59_smoke.py
          python python_hotfix_native\v591_smoke.py
          python python_hotfix_native\v510_smoke.py
          python python_hotfix_native\v5101_smoke.py
          python python_hotfix_native\v5103_smoke.py
          python python_hotfix_native\v60_smoke.py
          python python_hotfix_native\v601_smoke.py
          python python_hotfix_native\v602_smoke.py
          python python_hotfix_native\v602_taskbar_smoke.py
          python python_hotfix_native\v603_smoke.py
          python python_hotfix_native\v604_smoke.py
          python python_hotfix_native\v605_smoke.py
          python python_hotfix_native\v606_smoke.py

      - name: Build native BLE bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish native_bridge\PhomemoBleBridge\PhomemoBleBridge.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o native_bridge\publish
          if (-not (Test-Path native_bridge\publish\PhomemoBleBridge.exe)) { throw "No se generó PhomemoBleBridge.exe" }
          Write-Host "BLE bridge bytes: $((Get-Item native_bridge\publish\PhomemoBleBridge.exe).Length)"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = (Get-Content version.txt -Raw).Trim()
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build Python EXE
        shell: pwsh
        working-directory: python_app
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller --noconfirm --clean PhomemoStudio.spec
          if (-not (Test-Path dist\PhomemoStudio.exe)) { throw "PyInstaller no generó PhomemoStudio.exe" }
          Write-Host "EXE bytes: $((Get-Item dist\PhomemoStudio.exe).Length)"

      - name: Build standalone updater helper
        shell: pwsh
        working-directory: python_app
        run: |
          $ErrorActionPreference = "Stop"
          pyinstaller --noconfirm --clean --onefile --noconsole --name PhomemoStudioUpdater ..\python_hotfix_native\update_helper.py
          if (-not (Test-Path dist\PhomemoStudioUpdater.exe)) { throw "PyInstaller no generó PhomemoStudioUpdater.exe" }
          Write-Host "Updater EXE bytes: $((Get-Item dist\PhomemoStudioUpdater.exe).Length)"

      - name: Stage native BLE bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item native_bridge\publish\PhomemoBleBridge.exe python_app\dist\PhomemoBleBridge.exe -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        working-directory: python_app
        run: |
          $ErrorActionPreference = "Stop"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló" }
          $hash = (Get-FileHash dist\PhomemoStudioSetup.exe -Algorithm SHA256).Hash
          "$hash  PhomemoStudioSetup.exe" | Out-File -Encoding ascii dist\PhomemoStudioSetup.exe.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhomemoStudio-${{ steps.version.outputs.value }}-Quality606
          path: |
            python_app/dist/PhomemoStudioSetup.exe
            python_app/dist/PhomemoStudioSetup.exe.sha256
            python_app/dist/PhomemoStudio.exe
            python_app/dist/PhomemoBleBridge.exe
            python_app/dist/PhomemoStudioUpdater.exe

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v${{ steps.version.outputs.value }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target main --title "Phomemo Studio $tag" --notes "V6.0.6 mejora la fidelidad de impresión y la edición alrededor de la etiqueta física. El render del lienzo se hace a 4× y se reduce con LANCZOS antes del raster térmico para suavizar líneas, curvas y diagonales sin cambiar el tamaño físico final de 40×12 mm. El conversor detecta automáticamente puntillismo intencional como pequeños componentes oscuros/gris-medio aislados, incluso antialiasados, y los preserva/refuerza como puntos térmicos reales; las superficies grises continuas siguen usando tramado Bayer ordenado. Se agrega un Marco etiqueta como una sola trayectoria redondeada que acompaña la curvatura física y queda dentro de una zona segura de 1 mm. Esa zona segura se ve como guía punteada en el editor y no se imprime. Alinear a etiqueta ahora tiene 9 posiciones: centro, cuatro lados y las cuatro esquinas; todos los lados/esquinas respetan el margen seguro de 1 mm. Los trazos del marco usan extremos y uniones redondeadas. También se limpian los placeholders Batería — y Papel — del encabezado: sin lectura muestran simplemente Batería/Papel, conservando los valores reales cuando existen. Se mantienen el lienzo V6.0.5, la zona imprimible redondeada, concentración Liviana/Estándar/Concentrada, cola unificada, resize/rotación, selección múltiple estilo Illustrator, zoom, diseños persistentes, icono de Windows y actualizador independiente."
          }
          gh release upload $tag python_app\dist\PhomemoStudioSetup.exe python_app\dist\PhomemoStudioSetup.exe.sha256 --clobber
