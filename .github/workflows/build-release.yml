name: Build Windows installer and release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and hotfix desktop web app
        shell: pwsh
        run: |
          $parts = Get-ChildItem "patch\app_v301.gz.b64.part*" | Sort-Object Name
          if (-not $parts) { throw "No se encontraron los fragmentos de app_v301" }
          $joined = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $compressed = [Convert]::FromBase64String($joined)
          $input = [System.IO.MemoryStream]::new([byte[]]$compressed)
          $gzip = [System.IO.Compression.GZipStream]::new($input, [System.IO.Compression.CompressionMode]::Decompress)
          $outputPath = "src\PhomemoStudio\web\app.js"
          $output = [System.IO.File]::Create($outputPath)
          try { $gzip.CopyTo($output) }
          finally {
            $output.Dispose()
            $gzip.Dispose()
            $input.Dispose()
          }

          $app = Get-Content $outputPath -Raw
          if ($app -notmatch 'async function ensureConnected\s*\(') {
            $anchor = "  function setBtDiagnostic(msg)"
            if (-not $app.Contains($anchor)) { throw "No se encontró el punto de inserción para ensureConnected" }
            $helperLines = @(
              '  async function ensureConnected(){',
              '    if(!printer)throw new Error(''El controlador de la D30 no está listo.'');',
              '    if(printer.connected)return true;',
              '    setBtDiagnostic(''Conectando la D30 antes de continuar…'');',
              '    try{',
              '      await printer.connect(false);',
              '      updatePrinterUI();',
              '      if(!printer.connected)throw new Error(''No se pudo establecer la conexión con la D30.'');',
              '      setBtDiagnostic(`D30 lista · ${printer.device?.name||''impresora conectada''}`);',
              '      return true;',
              '    }catch(e){',
              '      updatePrinterUI();',
              '      setBtDiagnostic(`No se pudo conectar antes de imprimir: ${e?.message||e}`);',
              '      throw e;',
              '    }',
              '  }',
              ''
            )
            $helper = ($helperLines -join [Environment]::NewLine) + [Environment]::NewLine
            $app = $app.Replace($anchor, $helper + $anchor)
          }

          $oldStatus = "try{await printer.queryStatus();}catch(e){console.warn('status after connect',e);}"
          $newStatus = "setTimeout(()=>printer.queryStatus().catch(e=>console.warn('status after connect',e)),6000);"
          $app = $app.Replace($oldStatus, $newStatus)
          Set-Content -Path $outputPath -Value $app -Encoding utf8 -NoNewline

          $indexPath = "src\PhomemoStudio\web\index.html"
          $index = Get-Content $indexPath -Raw
          if ($index -notmatch 'desktop-shell\.js') {
            $index = $index.Replace('<script src="app.js"></script>', '<script src="app.js"></script>' + [Environment]::NewLine + '  <script src="desktop-shell.js"></script>')
            Set-Content -Path $indexPath -Value $index -Encoding utf8 -NoNewline
          }

          node --check $outputPath
          node --check "src\PhomemoStudio\web\desktop-shell.js"
          Write-Host "Restored + hotfixed $outputPath ($((Get-Item $outputPath).Length) bytes)"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore src/PhomemoStudio/PhomemoStudio.csproj

      - name: Publish Windows app
        shell: pwsh
        run: |
          dotnet publish src/PhomemoStudio/PhomemoStudio.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.value }} `
            -p:FileVersion=${{ steps.version.outputs.value }}.0 `
            -p:AssemblyVersion=${{ steps.version.outputs.value }}.0 `
            -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" installer\PhomemoStudio.iss
          $hash = (Get-FileHash dist\PhomemoStudioSetup.exe -Algorithm SHA256).Hash
          "$hash  PhomemoStudioSetup.exe" | Out-File -Encoding ascii dist\PhomemoStudioSetup.exe.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhomemoStudio-${{ steps.version.outputs.value }}
          path: |
            dist/PhomemoStudioSetup.exe
            dist/PhomemoStudioSetup.exe.sha256

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target main --title "Phomemo Studio $tag" --notes "Hotfix de impresión: restaura ensureConnected, mejora la reconexión antes de imprimir, retrasa la consulta de estado Bluetooth, corrige Buscar actualizaciones y agrega controles confiables para cerrar la app."
          }
          gh release upload $tag dist\PhomemoStudioSetup.exe dist\PhomemoStudioSetup.exe.sha256 --clobber
