name: Build Python Windows installer and release

on:
  push:
    branches: [ main, fix-connect-calibration-4.1.2 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Python source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem "python_src_v4.b64.part*" | Sort-Object Name
          if (-not $parts) { throw "No se encontraron los fragmentos del código Python" }
          $joined = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($joined)
          [IO.File]::WriteAllBytes("python_src_v4.zip", $bytes)
          if (Test-Path python_app) { Remove-Item python_app -Recurse -Force }
          New-Item -ItemType Directory -Force -Path python_app | Out-Null
          Expand-Archive -Path python_src_v4.zip -DestinationPath python_app -Force

      - name: Apply native Windows BLE backend
        shell: pwsh
        run: |
          Copy-Item python_hotfix_native\printer.py python_app\phomemo_studio\printer.py -Force
          Copy-Item python_hotfix_native\installer.iss python_app\installer.iss -Force
          $initPath = "python_app\phomemo_studio\__init__.py"
          $init = Get-Content $initPath -Raw
          $init = $init.Replace('__version__ = "4.0.0"', '__version__ = "4.1.1"')
          Set-Content -Path $initPath -Value $init -Encoding utf8 -NoNewline

          $bridgePath = "native_bridge\PhomemoBleBridge\Program.cs"
          $bridge = Get-Content $bridgePath -Raw
          $bridge = $bridge.Replace(
            'await BluetoothLEDevice.FromBluetoothAddressAsync(address).AsTask().ConfigureAwait(false)',
            'await BluetoothLEDevice.FromBluetoothAddressAsync(address).AsTask().WaitAsync(TimeSpan.FromSeconds(5)).ConfigureAwait(false)'
          )
          $bridge = $bridge.Replace(
            'await _device.GetGattServicesForUuidAsync(uuid, BluetoothCacheMode.Uncached).AsTask().ConfigureAwait(false)',
            'await _device.GetGattServicesForUuidAsync(uuid, BluetoothCacheMode.Uncached).AsTask().WaitAsync(TimeSpan.FromSeconds(4)).ConfigureAwait(false)'
          )
          $bridge = $bridge.Replace(
            'await _service.GetCharacteristicsAsync(BluetoothCacheMode.Uncached).AsTask().ConfigureAwait(false)',
            'await _service.GetCharacteristicsAsync(BluetoothCacheMode.Uncached).AsTask().WaitAsync(TimeSpan.FromSeconds(5)).ConfigureAwait(false)'
          )
          Set-Content -Path $bridgePath -Value $bridge -Encoding utf8 -NoNewline

      - name: Restore transparent Sr Gato assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path python_app\assets | Out-Null
          $parts = Get-ChildItem "src\PhomemoStudio\Assets\sr-gato.b64.part*" | Sort-Object Name
          if (-not $parts) { throw "No se encontraron los fragmentos del logo Sr Gato" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $png = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("python_app\assets\sr-gato.png", $png)

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r python_app\requirements.txt

      - name: Build transparent Windows icon
        shell: pwsh
        run: |
          python -c "from PIL import Image; from pathlib import Path; p=Path('python_app/assets/sr-gato.png'); img=Image.open(p).convert('RGBA'); bbox=img.getchannel('A').getbbox(); img=img.crop(bbox) if bbox else img; side=max(img.size); pad=max(8,int(side*.06)); out=Image.new('RGBA',(side+pad*2,side+pad*2),(0,0,0,0)); out.alpha_composite(img,((out.width-img.width)//2,(out.height-img.height)//2)); out.save('python_app/assets/sr-gato.ico',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)]); print('alpha',out.getchannel('A').getextrema())"

      - name: Run Python tests
        shell: pwsh
        env:
          PYTHONPATH: python_app
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q python_app\phomemo_studio python_app\tests
          pytest -q python_app\tests --ignore=python_app\tests\test_printer.py
          python -c "from phomemo_studio.printer import PrinterSnapshot, D30Printer; p=D30Printer(); assert p.snapshot.name=='D30'; p.close(); print('Native BLE wrapper smoke OK')"
          python -c "from PySide6.QtWidgets import QApplication; from phomemo_studio.ui import MainWindow; a=QApplication([]); w=MainWindow(); assert w.windowTitle().startswith('Phomemo Studio'); w.close(); print('UI smoke OK')"

      - name: Build native BLE bridge
        shell: pwsh
        run: |
          dotnet publish native_bridge\PhomemoBleBridge\PhomemoBleBridge.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o native_bridge\publish
          if (-not (Test-Path native_bridge\publish\PhomemoBleBridge.exe)) { throw "No se generó PhomemoBleBridge.exe" }

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build Python EXE
        shell: pwsh
        working-directory: python_app
        run: |
          pyinstaller --noconfirm --clean PhomemoStudio.spec
          if (-not (Test-Path dist\PhomemoStudio.exe)) { throw "PyInstaller no generó PhomemoStudio.exe" }

      - name: Stage native BLE bridge
        shell: pwsh
        run: |
          Copy-Item native_bridge\publish\PhomemoBleBridge.exe python_app\dist\PhomemoBleBridge.exe -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        working-directory: python_app
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" installer.iss
          $hash = (Get-FileHash dist\PhomemoStudioSetup.exe -Algorithm SHA256).Hash
          "$hash  PhomemoStudioSetup.exe" | Out-File -Encoding ascii dist\PhomemoStudioSetup.exe.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhomemoStudio-${{ steps.version.outputs.value }}-Hybrid-debug
          path: |
            python_app/dist/PhomemoStudioSetup.exe
            python_app/dist/PhomemoStudioSetup.exe.sha256
            python_app/dist/PhomemoStudio.exe
            python_app/dist/PhomemoBleBridge.exe
            python_app/phomemo_studio/ui.py
            python_app/phomemo_studio/core.py
            python_app/phomemo_studio/render.py

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.value }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target main --title "Phomemo Studio $tag" --notes "V4.1.1"
          }
          gh release upload $tag python_app\dist\PhomemoStudioSetup.exe python_app\dist\PhomemoStudioSetup.exe.sha256 --clobber
