name: Diagnose print hotfix

on:
  push:
    branches: [ diagnose-print-hotfix-3.1.2 ]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode app.js and inspect print paths
        shell: pwsh
        run: |
          $parts = Get-ChildItem "patch\app_v301.gz.b64.part*" | Sort-Object Name
          $joined = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $compressed = [Convert]::FromBase64String($joined)
          $input = [System.IO.MemoryStream]::new([byte[]]$compressed)
          $gzip = [System.IO.Compression.GZipStream]::new($input, [System.IO.Compression.CompressionMode]::Decompress)
          $outputPath = "decoded-app.js"
          $output = [System.IO.File]::Create($outputPath)
          try { $gzip.CopyTo($output) } finally { $output.Dispose(); $gzip.Dispose(); $input.Dispose() }
          Write-Host "=== ensureConnected matches ==="
          Select-String -Path $outputPath -Pattern "ensureConnected" -Context 8,12 | ForEach-Object { $_.ToString() }
          Write-Host "=== native desktop pieces ==="
          Select-String -Path $outputPath -Pattern "NativeD30|isNativeDesktop|nativeBridge|printer =|printer=new|new Native|new D30Printer" -Context 10,80 | ForEach-Object { $_.ToString() }
          Write-Host "=== tail ==="
          Get-Content $outputPath | Select-Object -Last 140
